<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2C4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contagem">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Contagem Pellegrini</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma tela. Faixa de progresso no topo, abas dos ambientes, planta ocupando o meio;
   o local aberto e o teclado sobem como folhas por cima do mapa. Cores dos locais seguem a legenda da planta da casa. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --surface2:#F4F6F7; --ink:#15202B; --muted:#586573; --line:#D2D9DF; --shadow:rgba(21,32,43,.16);
  --navy:#1C2C4A; --on-navy:#FFFFFF; --navy-soft:rgba(255,255,255,.14); --btn:#1C2C4A; --on-btn:#FFFFFF;
  --gel:#3D70C5; --on-gel:#FFFFFF; --est:#B3BBC3; --on-est:#15202B; --pal:#F0C09C; --on-pal:#3A2412;
  --prog:#E8A21E; --on-prog:#2A1C00; --done:#1E9A60; --on-done:#FFFFFF; --warn:#C9382A; --on-warn:#FFFFFF; --warn-bg:#FBE9E6;
  --vazio:#E1E5E9; --on-vazio:#74808B; --obst:#2B3138; --wall:#15202B; --rejunte:#DDE2E6; --piso:#F8FAFB;
  --steel:#C5CCD3; --steel2:#9EA9B3; --inner:#DFE4E8; --wire:#A9B3BC; --scrim:rgba(12,18,25,.55);
  --f-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-b:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#19212A; --surface2:#202A34; --ink:#E6ECF1; --muted:#97A4B1; --line:#2D3844; --shadow:rgba(0,0,0,.5);
  --navy:#16233B; --on-navy:#FFFFFF; --navy-soft:rgba(255,255,255,.14); --btn:#3A5A94; --on-btn:#FFFFFF;
  --gel:#4B7FD6; --on-gel:#FFFFFF; --est:#5C6671; --on-est:#EEF2F5; --pal:#A87853; --on-pal:#FFF4EA;
  --prog:#DFA02A; --on-prog:#241800; --done:#24A368; --on-done:#FFFFFF; --warn:#D9493A; --on-warn:#FFFFFF; --warn-bg:#3A1A16;
  --vazio:#222B34; --on-vazio:#7F8C99; --obst:#3A434D; --wall:#C8D2DB; --rejunte:#1C252E; --piso:#131A21;
  --steel:#3B4752; --steel2:#52606D; --inner:#141B22; --wire:#46535F; --scrim:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#19212A; --surface2:#202A34; --ink:#E6ECF1; --muted:#97A4B1; --line:#2D3844; --shadow:rgba(0,0,0,.5);
  --navy:#16233B; --on-navy:#FFFFFF; --navy-soft:rgba(255,255,255,.14); --btn:#3A5A94; --on-btn:#FFFFFF;
  --gel:#4B7FD6; --on-gel:#FFFFFF; --est:#5C6671; --on-est:#EEF2F5; --pal:#A87853; --on-pal:#FFF4EA;
  --prog:#DFA02A; --on-prog:#241800; --done:#24A368; --on-done:#FFFFFF; --warn:#D9493A; --on-warn:#FFFFFF; --warn-bg:#3A1A16;
  --vazio:#222B34; --on-vazio:#7F8C99; --obst:#3A434D; --wall:#C8D2DB; --rejunte:#1C252E; --piso:#131A21;
  --steel:#3B4752; --steel2:#52606D; --inner:#141B22; --wire:#46535F; --scrim:rgba(0,0,0,.62); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.35;overflow:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--prog);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* faixa do topo */
.top{background:var(--navy);color:var(--on-navy);padding-block:10px 0;flex:none}
.top .ln{display:flex;align-items:center;gap:10px;min-height:38px;padding-bottom:9px}
.top .tt{flex:1;min-width:0}
.top h1{font:600 23px/1.05 var(--f-d);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ct{font:700 24px/1 var(--f-d);font-variant-numeric:tabular-nums;text-align:right}
.top .ct small{display:block;font:500 11px/1.2 var(--f-b);opacity:.78}
.top .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--navy-soft);color:var(--on-navy);font:600 22px/1 var(--f-d);flex:none}
.barra{height:6px;background:var(--navy-soft)} .barra i{display:block;height:100%;background:var(--done);transition:width .35s}

/* botões */
.bt{flex:1;min-height:50px;border-radius:12px;font:600 19px/1 var(--f-d);letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;text-align:center}
.bt.p{background:var(--btn);color:var(--on-btn)} .bt.s{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.bt.ok{background:var(--done);color:var(--on-done)} .bt.w{background:var(--warn);color:var(--on-warn)}
.bt:disabled{opacity:.45;cursor:default} .bt.min{flex:none}
.lk{color:var(--muted);text-decoration:underline;font-size:13px;padding:8px 4px}

/* telas de entrada */
.rol{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.op{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.op .sel{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font:700 22px/1 var(--f-d);flex:none;background:var(--gel);color:var(--on-gel)}
.op .sel.b{background:var(--prog);color:var(--on-prog)} .op .sel.c{background:var(--est);color:var(--on-est)}
.op b{display:block;font:600 20px/1.15 var(--f-d)} .op span{font-size:13px;color:var(--muted)}
.aviso{font-size:13px;color:var(--muted);border-left:3px solid var(--prog);padding:2px 0 2px 10px}
.h2{font:600 13px/1.2 var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pin{display:flex;gap:12px;justify-content:center;padding:6px 0 2px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)} .pin i.on{background:var(--ink);border-color:var(--ink)}

/* teclado */
.tec{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tec button{height:54px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font:600 26px/1 var(--f-d)}
.tec button:active{background:var(--surface2)} .tec button.vz{visibility:hidden}

/* abas dos ambientes */
.abas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px;flex:none}
.aba{border-radius:10px;padding:6px 2px 5px;background:var(--surface);border:1px solid var(--line);text-align:center;min-width:0}
.aba b{display:block;font:600 clamp(13px,3.9vw,16px)/1.1 var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aba span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.aba[aria-selected="true"]{background:var(--btn);border-color:var(--btn);color:var(--on-btn)} .aba[aria-selected="true"] span{color:inherit;opacity:.8}

/* mapa */
.mapa{flex:1;min-height:0;position:relative;background:var(--piso);border-block:1px solid var(--line);overflow:hidden}
.mapa svg{position:absolute;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px);touch-action:none;user-select:none;-webkit-user-select:none}
.ferr{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl{display:flex;gap:6px}
.ctl button{width:40px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font:600 22px/1 var(--f-d)}
.vista{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vista button{padding:9px 12px;font:600 15px/1 var(--f-d);letter-spacing:.02em}
.vista button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.rejunte{stroke:var(--rejunte);stroke-width:1;fill:none}
.parede{stroke:var(--wall);stroke-width:3.2;stroke-linecap:square;fill:none}
.obst{fill:var(--obst)}
.piso-iso{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.loc{cursor:pointer;--c:var(--est);--on:var(--on-est)}
.loc.t-g{--c:var(--gel);--on:var(--on-gel)} .loc.t-p{--c:var(--pal);--on:var(--on-pal)}
.loc.s-and{--c:var(--prog);--on:var(--on-prog)} .loc.s-ok{--c:var(--done);--on:var(--on-done)}
.loc.s-vazio{--c:var(--vazio);--on:var(--on-vazio)}
.loc .cx{fill:var(--c);stroke:var(--ink);stroke-width:.8;stroke-opacity:.5}
.loc.s-vazio .cx{fill:url(#hach);stroke-dasharray:3 2}
.loc .f-t{fill:var(--c);stroke:var(--ink);stroke-width:.5;stroke-opacity:.35}
.loc .f-l{fill:var(--c);fill:color-mix(in srgb,var(--c) 80%,#000);stroke:var(--ink);stroke-width:.5;stroke-opacity:.35}
.loc .f-r{fill:var(--c);fill:color-mix(in srgb,var(--c) 62%,#000);stroke:var(--ink);stroke-width:.5;stroke-opacity:.35}
.loc .lb{fill:var(--on);font-family:var(--f-d);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.loc .mk{fill:none;stroke:var(--on);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.loc .pt{fill:var(--on);pointer-events:none}
.loc.fora{opacity:.36}
.hach-bg{fill:var(--vazio)} .hach-ln{stroke:var(--line);stroke-width:2}
.loc.pulso{animation:pulso .55s ease;transform-box:fill-box;transform-origin:center}
@keyframes pulso{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

.leg{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--muted);padding-block:7px 6px;flex:none}
.leg span{white-space:nowrap} .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.fora-planta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding-bottom:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:5px 9px;font:600 15px/1 var(--f-d);background:var(--c);color:var(--on);--c:var(--est);--on:var(--on-est)}
.chip.t-g{--c:var(--gel);--on:var(--on-gel)} .chip.t-p{--c:var(--pal);--on:var(--on-pal)}
.chip.s-and{--c:var(--prog);--on:var(--on-prog)} .chip.s-ok{--c:var(--done);--on:var(--on-done)} .chip.s-vazio{--c:var(--vazio);--on:var(--on-vazio)}
.pe{display:flex;gap:8px;padding-block:2px 10px;flex:none}

/* lista de locais */
.lista{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:10px;border-block:1px solid var(--line);background:var(--piso)}
.lista .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ll{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.ll .tx{min-width:0} .ll .tx b{display:block;font-size:13px;font-weight:600} .ll .tx span{font-size:12px;color:var(--muted)}

/* folhas */
.folha{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:var(--scrim);animation:esc .2s both}
.folha.f2{z-index:40}
.pn{background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;min-height:0;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);animation:sobe .26s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -6px 24px var(--shadow)}
.pn.cheia{height:calc(100% - 20px - env(safe-area-inset-top,0px))}
.folha.sai{animation:esc .2s reverse both} .folha.sai .pn{animation:sobe .22s reverse both}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
@keyframes esc{from{opacity:0}to{opacity:1}}
.cab{display:flex;align-items:center;gap:10px;padding-block:12px 10px;flex:none}
.cab .tt{flex:1;min-width:0} .cab .tt b{display:block;font:600 21px/1.1 var(--f-d)} .cab .tt span{font-size:12.5px;color:var(--muted)}
.x{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font:500 22px/1 var(--f-d);flex:none}
.placa{flex:none;min-width:58px;border-radius:6px;padding:5px 8px 4px;background:var(--c);color:var(--on);text-align:center;--c:var(--est);--on:var(--on-est);box-shadow:0 0 0 3px var(--surface),0 1px 4px var(--shadow)}
.placa.t-g{--c:var(--gel);--on:var(--on-gel)} .placa.t-p{--c:var(--pal);--on:var(--on-pal)}
.placa b{display:block;font:700 24px/1 var(--f-d)} .placa span{display:block;font:500 9.5px/1.2 var(--f-b);letter-spacing:.02em;opacity:.9}
.placa.pq{min-width:44px;padding:4px 6px 3px;box-shadow:none} .placa.pq b{font-size:18px} .placa.pq span{display:none}
.corpo{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.rod{display:flex;gap:8px;padding-block:10px;border-top:1px solid var(--line);background:var(--bg);flex:none}
.falta{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--prog);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.falta .bt{min-height:44px;font-size:17px;margin-top:8px;width:100%}

/* geladeira, estante e pallet abertos */
.mov{position:relative;background:var(--inner);perspective:1000px;overflow:hidden;padding-bottom:10px}
.mov.gel{border:9px solid var(--steel);border-radius:16px}
.mov.est{padding-inline:12px;border-top:5px solid var(--steel2)}
.mov.est::before,.mov.est::after{content:"";position:absolute;top:0;bottom:0;width:12px;background:radial-gradient(circle,var(--inner) 2px,transparent 2.6px) center/12px 14px repeat-y,var(--steel2);z-index:1}
.mov.est::before{left:0} .mov.est::after{right:0}
.mov.pal{border-bottom:14px solid var(--pal);border-radius:4px}
.porta{position:absolute;inset:0;z-index:3;background:linear-gradient(100deg,var(--steel2),var(--steel) 30%,var(--steel));transform-origin:right center;border-radius:7px;display:flex;flex-direction:column;align-items:center;padding-top:22px;pointer-events:none;animation:abre .75s .12s cubic-bezier(.35,.6,.2,1) both;backface-visibility:hidden}
.porta::after{content:"";position:absolute;left:16px;top:38%;width:9px;height:24%;border-radius:5px;background:var(--steel2)}
.sai .porta{animation:fecha .32s ease both}
@keyframes abre{from{transform:rotateY(0)}to{transform:rotateY(-104deg)}}
@keyframes fecha{from{transform:rotateY(-104deg)}to{transform:rotateY(0)}}
.prat{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 9px 0}
.arame{height:7px;margin-top:8px;border-top:2px solid var(--wire);background:repeating-linear-gradient(90deg,var(--wire) 0 2px,transparent 2px 8px);opacity:.9}
.it{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:84px;border-radius:10px;padding:8px 9px;text-align:left;min-width:0;background:var(--surface);border:1.5px solid var(--surface)}
.it .nm{font-size:12.5px;line-height:1.25;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.it .vl{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.it .vl b{font:700 22px/1 var(--f-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.it .vl span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.it .un{font:600 11px/1 var(--f-d);letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:2px 4px;opacity:.75;flex:none}
.it.pend{background:transparent;border:1.5px dashed var(--wire);color:var(--muted)}
.it.pend .vl span{font-size:12px}
.it.ok{border-color:var(--done)} .it.ok .vl b{color:var(--done)}
.it.zero .vl b{color:var(--muted)}
.it.extra .nm::before{content:"novo · ";color:var(--prog);font-weight:700}
.sem{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* lançamento */
.lanc{padding-block:0 10px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font:600 17px/1 var(--f-d);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.vis{display:flex;gap:8px;align-items:stretch}
.cmp{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 10px 7px;text-align:left}
.cmp.on{border-color:var(--btn)} .cmp.est{flex:0 0 34%}
.cmp small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp b{display:block;font:700 30px/1.05 var(--f-d);font-variant-numeric:tabular-nums;min-height:32px;white-space:nowrap}
.cmp b i{font:500 15px/1 var(--f-b);font-style:normal;color:var(--muted);margin-left:4px}
.cmp b.vz{color:var(--muted);opacity:.5}
.liq{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.liq b{font:700 19px/1 var(--f-d);color:var(--ink)}
.taras{display:flex;flex-wrap:wrap;gap:6px}
.taras button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font:600 15px/1 var(--f-d)}
.taras button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.parc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.parc button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font:600 15px/1 var(--f-d);color:var(--ink)}
.parc button i{font-style:normal;color:var(--warn)}
.alerta{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.alerta .ac{display:flex;gap:8px}
.acoes{display:flex;gap:8px}

/* incluir item */
.busca{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--f-b);padding:0 12px}
.res{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.res button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-width:0}
.res button span{min-width:0;overflow-wrap:anywhere}
.res .novo{border-style:dashed;flex-direction:column;align-items:stretch;gap:8px}
.res .novo .ac{display:flex;gap:8px} .res .novo .bt{min-height:42px;font-size:16px}

/* resumo */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font:700 26px/1 var(--f-d);font-variant-numeric:tabular-nums} .kpi span{font-size:11.5px;color:var(--muted)}
.pend-l{display:flex;flex-wrap:wrap;gap:6px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font:600 11px/1.2 var(--f-b);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tb td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tb td.n,.tb th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tb td.n b{font:700 17px/1 var(--f-d)} .tb td small{color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13.5px;max-width:86%;text-align:center;box-shadow:0 4px 16px var(--shadow)}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01s !important;transition-duration:.01s !important} }

/* ---------- versão ligada à planilha: formulários, usuários, envio, foto ---------- */
.sync{font:600 11px/1 var(--f-b);padding:5px 8px;border-radius:99px;background:var(--navy-soft);color:var(--on-navy);white-space:nowrap;flex:none}
.sync.pend{background:var(--prog);color:var(--on-prog)} .sync.err{background:var(--warn);color:var(--on-warn)}
.frm{display:flex;flex-direction:column;gap:8px}
.frm label{font-size:13px;font-weight:600;color:var(--muted)}
.frm .bt{margin-top:6px;flex:none}
.frm.lin{flex-direction:row;align-items:center;flex-wrap:wrap} .frm.lin .busca{flex:1;min-width:110px;width:auto} .frm.lin .bt{margin-top:0}
.chk{display:flex;align-items:center;gap:10px;font-size:14.5px !important;font-weight:500 !important;color:var(--ink) !important;min-height:36px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--btn)}
.usr{display:flex;flex-direction:column;gap:10px}
.bt.pq{min-height:40px;font-size:16px;flex:none}
.op[aria-current="true"]{border-color:var(--btn);box-shadow:0 0 0 2px var(--btn)}
.op:disabled{opacity:.5}
.folha.f3{z-index:50}
.fotop{display:flex;flex-direction:column;gap:8px} .fotop img{display:block;width:100%;max-height:34vh;object-fit:contain;border-radius:8px;background:var(--inner)}
label.bt{cursor:pointer}
.seg{flex-wrap:wrap} .seg button{flex:1 1 30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 6px}
.seg button small{font:500 10.5px/1 var(--f-b);opacity:.75}
.busca,.bt{box-sizing:border-box}
</style>
</head>
<body>
<div id="app"></div>
<div id="folhas"></div>
<div id="toast" hidden role="status"></div>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const API_URL = (window.CONTAGEM_API || '');            // vazio = protótipo sem servidor (dados só no aparelho)
const ONLINE = !!API_URL;
const TIPO = {g:'Geladeira', e:'Estante', p:'Pallet'};
const NOME_TIPO = {semanal:'Contagem semanal', diaria:'Contagem diária', avulsa:'Contagem avulsa'};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v, d) => Number(v).toLocaleString('pt-BR', {maximumFractionDigits: d == null ? 3 : d});
const kg = g => nf(g / 1000) + ' kg';
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const natural = (a, b) => a.localeCompare(b, 'pt-BR', {numeric:true});
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
const iniciais = n => n.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();

/* ---------- cadastro (vem da planilha ou, no protótipo, embutido na página) ---------- */
let AMB = [], LOCI = {}, NOTAS = {}, DIARIA = [], FOTO = {}, LOC = {}, ITENS = [], IDX = {}, PINLEN = 4;
function carregaConfig(c) {
  AMB = c.amb; NOTAS = c.notas || {}; DIARIA = (c.listas && c.listas.diaria) || c.diaria || []; FOTO = c.fotos || {};
  ITENS = c.itens.map((it, k) => Object.assign({}, it, {id: it.id || 'I' + String(k + 1).padStart(4, '0'), e: it.e ? it.e.map(e => Object.assign({}, e)) : undefined}));
  IDX = {}; ITENS.forEach((it, k) => { IDX[it.id] = k; });
  (S.novos || []).forEach(it => { if (IDX[it.id] == null) { IDX[it.id] = ITENS.length; ITENS.push(Object.assign({}, it, {e: it.e ? it.e.map(e => Object.assign({}, e)) : undefined})); } });
  LOCI = {};
  Object.keys(c.locais).forEach(l => { LOCI[l] = c.locais[l].map(x => ({i: x.item != null ? IDX[x.item] : x.i, t: x.t || 0, r: x.r || 'potes'})).filter(x => x.i != null); });
  LOC = {};
  AMB.forEach(a => {
    a.shapes.forEach(s => { if (s.id) LOC[s.id] = {id:s.id, t:s.t, amb:a.id, label:s.id}; });
    (a.virt || []).forEach(v => { LOC[v.id] = {id:v.id, t:v.t, amb:a.id, label:v.label, virt:true}; });
  });
  if (!S.amb || !AMB.some(a => a.id === S.amb)) S.amb = AMB[0].id;
}
function idxItem(id, st) {
  if (IDX[id] != null) return IDX[id];
  const peso = st && st.l && st.l[0] && st.l[0].b != null;
  const it = {id, n:'Item fora do cadastro (' + id + ')', u: peso ? 'g' : 'un', fantasma:true}; if (!peso) it.e = [{n:'Unidade', f:1}];
  IDX[id] = ITENS.length; ITENS.push(it); return IDX[id];
}
function idxEmb(it, ap, f, loc) {
  let k = it.e.findIndex(e => e.n === ap && (!e.l || e.l === loc));
  if (k < 0) { it.e.push({n:ap, f:f == null ? null : f, l:loc, x:1}); k = it.e.length - 1; }
  return k;
}
const embsLocal = (it, loc) => it.e.map((e, k) => k).filter(k => !it.e[k].x && (!it.e[k].l || it.e[k].l === loc));

/* ---------- estado ---------- */
const KEY = ONLINE ? 'contagem-pellegrini-online-v1' : 'contagem-pellegrini-v2';
let S = {user:null, token:null, sess:null, amb:null, vista:'planta', novos:[], view:'login', fila:[], cfg:null};
let sessGuardada = null;
try { const raw = localStorage.getItem(KEY); if (raw) { S = Object.assign(S, JSON.parse(raw)); if (S.sess) { sessGuardada = S.sess.loc || {}; S.sess.loc = {}; } } } catch (e) {}
function exportaSess() {
  const out = {};
  Object.keys(S.sess.loc).forEach(l => {
    const r = S.sess.loc[l], it = {};
    Object.keys(r.it).forEach(i => { const item = ITENS[i], st = r.it[i]; it[item.id] = st.z ? {z:1} : {l: st.l.map(p => item.u === 'g' ? {b:p.b, n:p.n, t:p.t} : {ap:item.e[p.e].n, f:item.e[p.e].f, q:p.q})}; });
    out[l] = {it, ex:r.ex.map(i => ITENS[i].id), ok:!!r.ok, t0:r.t0 || 0, foto:r.foto || ''};
  });
  return out;
}
function importaSess(dados) {
  const loc = {};
  Object.keys(dados || {}).forEach(l => {
    const r = dados[l], o = loc[l] = {it:{}, ex:[], ok:!!r.ok, t0:r.t0 || 0, foto:r.foto || ''};
    Object.keys(r.it || {}).forEach(id => { const st = r.it[id], i = idxItem(id, st), item = ITENS[i];
      o.it[i] = st.z ? {z:1} : {l: st.l.map(p => item.u === 'g' ? {b:+p.b || 0, n:+p.n || 0, t:+p.t || 0} : {e:idxEmb(item, p.ap, p.f, l), q:+p.q || 0})}; });
    (r.ex || []).forEach(id => { const i = idxItem(id); if (!o.ex.includes(i) && !(LOCI[l] || []).some(x => x.i === i)) o.ex.push(i); });
  });
  S.sess.loc = loc;
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, S, {sess: S.sess ? Object.assign({}, S.sess, {loc: ITENS.length ? exportaSess() : (sessGuardada || {})}) : null}))); } catch (e) {} };

let O = null, OC = false, E = null, A = null, PIN = '', U = null, LISTA = false, TROCA = null, FIM = false, FILTRO = '';
let Z = {k:1, tx:0, ty:0}, VB = {w:1, h:1}, GEO = [], tAbre = 0;
let BOOT = {st: ONLINE ? 'carregando' : 'ok', msg:'', tem:true}, USERS = [], ERRO = '', OCUP = false, ABERTAS = [], ADM = null, FT = null, SYNCERR = '';
const USUARIOS_DEMO = [{id:'demo-admin', nome:'Administrador', papel:'admin'}, {id:'demo-cont', nome:'Funcionário de teste', papel:'contador'}];
const ehAdmin = () => S.user && S.user.papel === 'admin';

const ambAtual = () => AMB.find(a => a.id === S.amb) || AMB[0];
const locsAmb = id => { const a = AMB.find(x => x.id === id); return a.shapes.filter(s => s.id).map(s => s.id).concat((a.virt || []).map(v => v.id)); };
function itensLocal(loc) {
  const base = (LOCI[loc] || []).map(x => ({i:x.i, t:x.t || 0, r:x.r || 'potes'}));
  const r = S.sess && S.sess.loc[loc];
  return base.concat(((r && r.ex) || []).map(i => ({i, t:0, r:'potes', ex:true})));
}
function reg(loc) { const L = S.sess.loc; if (!L[loc]) L[loc] = {it:{}, ex:[], ok:false, t0:0, foto:''}; return L[loc]; }
function status(loc) {
  if (!itensLocal(loc).length) return 'vazio';
  const r = S.sess && S.sess.loc[loc];
  if (r && r.ok) return 'ok';
  if (r && Object.keys(r.it).length) return 'and';
  return 'pend';
}
function escopo() {
  if (!S.sess) return [];
  const ini = Object.keys(S.sess.loc).filter(l => { const r = S.sess.loc[l]; return r.ok || Object.keys(r.it).length || r.ex.length; });
  const base = S.sess.tipo === 'semanal' ? Object.keys(LOCI) : S.sess.tipo === 'diaria' ? DIARIA : [];
  return Array.from(new Set(base.concat(ini))).filter(l => LOC[l]);
}
function total(st, it) {
  if (!st) return null;
  if (st.z) return {v:0, txt:'0', det:'não tem'};
  if (it.u === 'g') {
    const g = st.l.reduce((s, p) => s + Math.max(0, p.b - p.n * p.t), 0);
    return {v:g, txt:kg(g), det:st.l.length > 1 ? st.l.length + ' pesagens' : ''};
  }
  const por = {}; st.l.forEach(p => { por[p.e] = (por[p.e] || 0) + p.q; });
  let v = 0; const sem = [], partes = [];
  Object.keys(por).forEach(e => {
    const em = it.e[e]; const rot = por[e] + ' × ' + em.n.toLowerCase();
    if (em.f == null) sem.push(rot); else { v += por[e] * em.f; if (em.f !== 1) partes.push(rot); else if (Object.keys(por).length > 1) partes.push(por[e] + ' un'); }
  });
  if (sem.length) return {v, txt:(v ? nf(v) + ' + ' : '') + sem.join(' + '), det:'sem quantidade definida', sem:sem.join(' + ')};
  return {v, txt:nf(v), det:partes.join(' + ')};
}
const dataCurta = iso => new Date(iso).toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'});
let tT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, 3000); }

/* ---------- servidor: chamada, fila de envio e sincronização ---------- */
async function api(fn, d) {
  const r = await fetch(API_URL, {method:'POST', body:JSON.stringify({fn, d:d || {}, token:S.token})});
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.erro || 'Erro no servidor'); e.cod = j.cod || 'erro'; throw e; }
  return j.r;
}
function envia(fn, d) { if (!ONLINE) return; S.fila.push({id:uid(), fn, d}); persist(); selo(); bombear(); }
let bombando = false, espera = 0;
async function bombear() {
  if (!ONLINE || bombando || !S.fila.length || !S.token) return;
  bombando = true; selo();
  while (S.fila.length) {
    const m = S.fila[0];
    try { await api(m.fn, m.d); S.fila.shift(); persist(); espera = 0; SYNCERR = ''; }
    catch (e) {
      if (e.cod === 'login') { SYNCERR = 'login'; break; }
      if (e.cod) { S.fila.shift(); persist(); toast('Não foi gravado: ' + e.message); continue; }
      SYNCERR = 'rede'; espera = Math.min(30000, (espera || 1500) * 2); setTimeout(bombear, espera); break;
    }
    selo();
  }
  bombando = false; selo();
  if (SYNCERR === 'login') { S.token = null; S.user = null; S.view = 'login'; persist(); render(); toast('Sua sessão venceu. Entre de novo; nada do que você lançou se perdeu.'); }
}
function selo() {
  const el = $('#sync'); if (!el) return;
  const n = S.fila.length;
  el.className = 'sync' + (SYNCERR ? ' err' : n ? ' pend' : '');
  el.textContent = SYNCERR === 'rede' ? 'sem rede · ' + n : n ? 'enviando ' + n : 'salvo';
}
const seloHtml = () => ONLINE ? `<span id="sync" class="sync" role="status"></span>` : '';
function estadoDoServidor(est) {
  const dados = {};
  (est.itens || []).forEach(x => { const o = dados[x.local] = dados[x.local] || {it:{}, ex:[]}; o.it[x.item] = x.z ? {z:1} : {l:x.l}; if (x.ex) o.ex.push(x.item); });
  (est.ok || []).forEach(l => { (dados[l] = dados[l] || {it:{}, ex:[]}).ok = true; });
  const antes = S.sess.loc || {};
  Object.keys(dados).forEach(l => { if (antes[l]) { dados[l].t0 = antes[l].t0; dados[l].foto = antes[l].foto; } });
  importaSess(dados);
}
async function atualizaEstado() {
  if (!ONLINE || !S.sess || S.sess.fim || S.fila.length || bombando) return;
  try { const r = await api('contagem.estado', {id:S.sess.id}); if (S.fila.length || !S.sess || S.sess.id !== r.id) return;
    if (r.status !== 'aberta') { S.sess.fim = new Date().toISOString(); }
    estadoDoServidor(r.estado); persist(); if (!O && !E) render(); } catch (e) {}
}
async function buscaConfig(forca) {
  const guard = S.sess && ITENS.length ? exportaSess() : sessGuardada;
  const c = await api(forca ? 'config.atualizar' : 'config');
  S.cfg = c; carregaConfig(c); if (c.cfg && +c.cfg.pin_digitos >= 4) PINLEN = +c.cfg.pin_digitos;
  if (S.sess) importaSess(guard); sessGuardada = null; persist();
}
async function iniciar() {
  if (!ONLINE) {
    carregaConfig(JSON.parse(document.getElementById('seed').textContent));
    if (S.sess) importaSess(sessGuardada); sessGuardada = null; USERS = USUARIOS_DEMO; render(); zoomInicial(); return;
  }
  if (S.cfg) { try { carregaConfig(S.cfg); if (S.sess) importaSess(sessGuardada); BOOT.st = 'ok'; } catch (e) {} }
  render();
  try {
    const p = await api('ping'); PINLEN = p.pin || 4; BOOT.tem = p.temUsuarios;
    USERS = await api('usuarios.publico');
    if (S.token) { try { await buscaConfig(false); } catch (e) { if (e.cod === 'login') { S.token = null; S.user = null; S.view = 'login'; } else if (!S.cfg) throw e; } }
    BOOT.st = 'ok'; BOOT.msg = '';
  } catch (e) {
    if (S.cfg && S.token) BOOT.st = 'ok'; else { BOOT.st = 'erro'; BOOT.msg = e.cod ? e.message : 'Sem conexão com o servidor. Confira a internet e tente de novo.'; }
  }
  render(); zoomInicial(); bombear(); atualizaEstado();
  if (S.user && S.view === 'inicio') carregaAbertas();
}
async function carregaAbertas() { if (!ONLINE) return; try { ABERTAS = await api('contagem.abertas'); if (S.view === 'inicio') render(); } catch (e) {} }

/* ---------- telas ---------- */
function topo(titulo, sub, dir, volta) {
  return `<header class="top"><div class="g ln">${volta ? `<button class="ic" data-a="${volta}" aria-label="Voltar">‹</button>` : ''}<div class="tt"><h1>${esc(titulo)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>${dir || ''}</div>__B__</header>`;
}
const erroHtml = () => ERRO ? `<div class="falta" style="border-left-color:var(--warn)" role="alert">${esc(ERRO)}</div>` : '';
function tecladoPin(acao) {
  return `<div class="pin" aria-label="${PIN.length} de ${PINLEN} dígitos">${Array.from({length:PINLEN}, (x, k) => `<i class="${k < PIN.length ? 'on' : ''}"></i>`).join('')}</div>
  <div class="tec">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-a="${acao}" data-v="${n}">${n}</button>`).join('')}<button class="vz" tabindex="-1" aria-hidden="true"></button><button data-a="${acao}" data-v="0">0</button><button data-a="${acao}" data-v="x" aria-label="Apagar">⌫</button></div>`;
}
function viewCarga() {
  const corpo = BOOT.st === 'erro' ? `<div class="falta" style="border-left-color:var(--warn)">${esc(BOOT.msg)}</div><button class="bt p" data-a="de-novo" style="flex:none">Tentar de novo</button>` : `<p class="aviso">Carregando o cadastro…</p>`;
  return topo('Contagem Pellegrini', 'Estoque por local', '').replace('__B__', '') + `<div class="rol g">${corpo}</div>`;
}
function viewLogin() {
  if (ONLINE && !BOOT.tem) {
    return topo('Contagem Pellegrini', 'Primeiro acesso', '').replace('__B__', '') + `<div class="rol g"><div class="h2">Criar o administrador</div>${erroHtml()}
    <form class="cartao frm" data-f="admin-inicial"><label for="adm-nome">Seu nome</label><input class="busca" id="adm-nome" name="nome" autocomplete="name" required minlength="2">
    <label for="adm-pin">PIN de ${PINLEN} dígitos</label><input class="busca" id="adm-pin" name="pin" inputmode="numeric" pattern="\\d{${PINLEN}}" maxlength="${PINLEN}" autocomplete="off" required>
    <button class="bt p" type="submit" ${OCUP ? 'disabled' : ''}>${OCUP ? 'Criando…' : 'Criar e entrar'}</button></form>
    <p class="aviso">Só aparece enquanto não existe nenhum usuário. Depois, quem cria os outros é o administrador.</p></div>`;
  }
  const lista = USERS.map((u, k) => `<button class="cartao op" data-a="quem" data-v="${k}" ${U === k ? 'aria-current="true"' : ''}><span class="sel${u.papel === 'admin' || !u.papel && !k ? '' : ' c'}">${esc(iniciais(u.nome))}</span><span><b>${esc(u.nome)}</b>${u.papel ? `<span>${u.papel === 'admin' ? 'Administrador' : 'Contador'}</span>` : ''}</span></button>`).join('');
  const pin = U == null ? '' : `<div class="cartao" style="display:flex;flex-direction:column;gap:12px"><div class="h2">PIN de ${esc(USERS[U].nome)}</div>${erroHtml()}${OCUP ? '<p class="aviso">Conferindo…</p>' : tecladoPin('pin')}</div>`;
  const aviso = ONLINE ? '' : `<p class="aviso">Protótipo de validação: qualquer PIN de ${PINLEN} dígitos entra e nada vai para a planilha.</p>`;
  return topo('Contagem Pellegrini', 'Estoque por local', '').replace('__B__', '') + `<div class="rol g"><div class="h2">Quem está contando?</div>${lista || '<p class="aviso">Nenhum usuário ativo.</p>'}${pin}${aviso}</div>`;
}
function viewTrocaPin() {
  return topo('Trocar o PIN', S.user.nome, '', S.user.trocar ? '' : 'inicio').replace('__B__', '') + `<div class="rol g">${S.user.trocar ? '<p class="aviso">O administrador pediu para você escolher um PIN novo antes de continuar.</p>' : ''}${erroHtml()}
  <form class="cartao frm" data-f="troca-pin"><label for="tp-atual">PIN atual</label><input class="busca" id="tp-atual" name="atual" inputmode="numeric" maxlength="8" autocomplete="off" required>
  <label for="tp-novo">PIN novo (${PINLEN} dígitos)</label><input class="busca" id="tp-novo" name="novo" inputmode="numeric" pattern="\\d{${PINLEN}}" maxlength="${PINLEN}" autocomplete="off" required>
  <button class="bt p" type="submit" ${OCUP ? 'disabled' : ''}>${OCUP ? 'Salvando…' : 'Salvar PIN novo'}</button></form></div>`;
}
function viewInicio() {
  const s = S.sess; let cont = '';
  if (s && !s.fim) {
    const es = escopo(), f = es.filter(l => status(l) === 'ok').length;
    cont = `<div class="cartao" style="display:flex;flex-direction:column;gap:10px"><div class="h2">Em andamento neste aparelho</div><div><b style="font:600 21px/1.1 var(--f-d)">${NOME_TIPO[s.tipo]} · ${dataCurta(s.ini)}</b><div style="font-size:13px;color:var(--muted)">${f} de ${es.length} locais contados · iniciada por ${esc(s.por)}</div></div><div style="display:flex;gap:8px"><button class="bt p" data-a="continuar">Continuar</button></div></div>`;
  }
  const outras = ONLINE ? ABERTAS.filter(c => !s || s.fim || c.id !== s.id) : [];
  const abertas = outras.length ? `<div class="h2">Abertas por outra pessoa</div>${outras.map(c => `<button class="cartao op" data-a="entrar" data-v="${esc(c.id)}"><span class="sel c">↪</span><span><b>${NOME_TIPO[c.tipo] || c.tipo} · ${dataCurta(c.ini)}</b><span>iniciada por ${esc(c.por)} · tocar para entrar</span></span></button>`).join('')}` : '';

    if (v === 'x') PIN = PIN.slice(0, -1); else if (PIN.length < PINLEN) PIN += v;
    if (PIN.length < PINLEN) { render(); return; }
    const u = USERS[U], pin = PIN; PIN = '';
    if (!ONLINE) { S.user = {id:u.id, nome:u.nome, papel:u.papel}; S.view = 'inicio'; U = null; persist(); render(); return; }
    OCUP = true; ERRO = ''; render();
    try {
      const r = await api('login', {id:u.id, pin}); S.token = r.token; S.user = r.usuario; U = null;
      await buscaConfig(false);
      S.view = S.user.trocar ? 'trocapin' : (S.sess && !S.sess.fim ? 'mapa' : 'inicio'); OCUP = false; persist(); render(); zoomInicial(); bombear(); atualizaEstado(); carregaAbertas();
    } catch (e) { OCUP = false; ERRO = e.cod ? e.message : 'Sem conexão. Confira a internet.'; render(); }
  },
  sair() { S.user = null; S.token = null; S.view = 'login'; ERRO = ''; persist(); render(); },
  'troca-pin'() { ERRO = ''; S.view = 'trocapin'; render(); },
  nova(v) { if (S.sess && !S.sess.fim && Object.keys(S.sess.loc).length) { TROCA = v; render(); return; } inicia(v); },
  'nao-troca'() { TROCA = null; render(); }, 'sim-troca'() { const v = TROCA; TROCA = null; inicia(v); },
  entrar(v) { entra(v); },
  continuar() { S.view = 'mapa'; persist(); render(); atualizaEstado(); },
  zerar() { try { localStorage.removeItem(KEY); } catch (e) {} S = Object.assign(S, {sess:null, view:'inicio'}); toast('Dados do protótipo apagados neste aparelho.'); render(); },
  usuarios() { ADM = {lista:null, pin:null}; ERRO = ''; S.view = 'usuarios'; render(); carregaUsuarios(); },
  'u-pin'(v) { ADM.pin = v; render(); const el = document.getElementById('np-' + v); if (el) el.focus(); },
  'u-ativo'(v) { const u = ADM.lista.find(x => x.id === v); salvaUsuario({id:v, ativo:!u.ativo}); },
  async recadastro() { OCUP = true; ERRO = ''; render(); try { await buscaConfig(true); toast('Cadastro atualizado: ' + ITENS.length + ' itens.'); } catch (e) { ERRO = e.cod ? e.message : 'Sem conexão.'; } OCUP = false; render(); },
  inicio() { S.view = 'inicio'; FIM = false; ERRO = ''; persist(); render(); carregaAbertas(); },
  mapa() { S.view = 'mapa'; FIM = false; persist(); render(); },
  resumo() { S.view = 'resumo'; FIM = false; FILTRO = ''; persist(); render(); },
  amb(v) { S.amb = v; persist(); render(); zoomInicial(); },
  vista(v) { S.vista = v; persist(); render(); zoomInicial(); },
  zoom(v) { zoomEm(VB.w / 2, VB.h / 2, Z.k * (+v > 0 ? 1.5 : 1 / 1.5)); },
  lista() { LISTA = !LISTA; render(); },
  abrir(v) { abrirLocal(v); },
  ir(v) { S.view = 'mapa'; S.amb = LOC[v].amb; persist(); render(); zoomInicial(); abrirLocal(v); },
  fim() { FIM = true; render(); }, 'nao-fim'() { FIM = false; render(); },
  'sim-fim'() { S.sess.fim = new Date().toISOString(); FIM = false; envia('contagem.encerrar', {id:S.sess.id}); persist(); render(); },
  fundo(v, el, ev) { if (ev.target === el && Date.now() - tAbre > 400) fecharLocal(); },
  fechar() { fecharLocal(); },
  item(v) { if (FT) return; abrirItem(+v); },
  incluir() { abrirIncluir(); },
  concluir() { const its = itensLocal(O), r = reg(O); const falta = its.filter(x => !r.it[x.i]).length;
    if (falta) { OC = true; desenhaLocal(false); const c = $('#corpo-local'); if (c) c.scrollTop = c.scrollHeight; return; }
    concluiOuFoto(O); },
  'zerar-resto'() { const r = reg(O), novos = []; itensLocal(O).forEach(x => { if (!r.it[x.i]) { r.it[x.i] = {z:1}; novos.push({i:x.i, st:r.it[x.i]}); } }); enviaLanc(O, novos); persist(); concluiOuFoto(O); },
  'foto-volta'() { FT = null; desenhaLocal(false); },
  'sem-foto'() { finalizaLocal(O, 'sem foto'); },
  async 'foto-ok'() {
    if (!ONLINE) { finalizaLocal(O, 'protótipo'); return; }
    const loc = O; FT.busy = true; FT.erro = ''; desenhaLocal(false);
    try { const r = await api('foto', {contagem:S.sess.id, local:loc, b64:FT.b64, mime:'image/jpeg', ts:Date.now()}); if (O === loc) finalizaLocal(loc, r.id); }
    catch (e) { if (FT) { FT.busy = false; FT.erro = e.cod ? e.message : 'Sem conexão: a foto não foi enviada. Tente de novo ou conclua sem foto.'; desenhaLocal(false); } }
  },
  'fundo-item'(v, el, ev) { if (ev.target === el && Date.now() - tAbre > 400) fechaItem(); }, 'fecha-item'() { fechaItem(); },
  tecla(v) {
    if (E.campo === 'n') { if (v === 'x') E.nbuf = E.nbuf.slice(0, -1); else if (v !== ',' && E.nbuf.length < 2) E.nbuf += v; E.n = E.nbuf ? parseInt(E.nbuf, 10) : 0; desenhaItem(false); return; }
    const peso = ITENS[E.i].u === 'g';
    if (v === 'x') E.buf = E.buf.slice(0, -1);
    else if (v === ',') { if (!E.buf.includes(',')) E.buf = (E.buf || '0') + ','; }
    else { const dec = E.buf.split(',')[1]; if (dec != null ? dec.length < 3 : E.buf.replace(',', '').length < (peso ? 6 : 5)) E.buf = (E.buf === '0' ? '' : E.buf) + v; }
    desenhaItem(false);
  },
  campo(v) { E.campo = v; if (v === 'n') E.nbuf = ''; desenhaItem(false); },
  un(v) { if (E.un !== v) { E.un = v; E.buf = ''; } desenhaItem(false); },
  emb(v) { E.emb = +v; desenhaItem(false); },
  taras() { E.taras = !E.taras; desenhaItem(false); },
  tara(v) { E.t = +v; E.taras = false; if (E.t && !E.n) E.n = 1; desenhaItem(false); },
  soma() { const p = parcelaAtual(); if (!p) { toast('Digite um valor para somar.'); return; } E.par.push(p); E.buf = ''; E.campo = 'q'; desenhaItem(false); },
  tira(v) { E.par.splice(+v, 1); desenhaItem(false); },
  salvar() { salvarItem(false); },
  corrigir() { E.aviso = null; desenhaItem(false); },
  'era-g'() { E.un = 'g'; E.aviso = null; salvarItem(false); },
  confirma() { gravaItem({l:E.parTmp}); },
  zero() { gravaItem({z:1}); },
  apaga() { gravaItem(null); },
  'nova-ap'() { abrirAp(); }, 'fundo-ap'(v, el, ev) { if (ev.target === el) fechaAp(); }, 'fecha-ap'() { fechaAp(); },
  'fundo-inc'(v, el, ev) { if (ev.target === el) fechaIncluir(); }, 'fecha-inc'() { fechaIncluir(); },
  inc(v) { incluir(+v); },
  cria(v) { const n = A.q.trim(); const it = {id:'N' + uid().replace(/-/g, '').slice(0, 10), n, u:v, novo:true}; if (v === 'un') it.e = [{n:'Unidade', f:1}];
    S.novos.push(it); IDX[it.id] = ITENS.length; ITENS.push(Object.assign({}, it, {e:it.e ? it.e.map(e => Object.assign({}, e)) : undefined}));
    envia('item.criar', {id:it.id, nome:n, u:v}); incluir(ITENS.length - 1); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = act[el.getAttribute('data-a')]; if (f) f(el.getAttribute('data-v'), el, ev);
});
document.addEventListener('input', ev => { if (ev.target.id === 'filtro') { FILTRO = ev.target.value; const tb = $('#tbres'); if (tb) tb.innerHTML = linhasResumo(); } });
document.addEventListener('change', ev => { if (ev.target.id === 'cam') { recebeFoto(ev.target.files && ev.target.files[0]); ev.target.value = ''; } });
const forms = {
  async 'admin-inicial'(fd) {
    OCUP = true; ERRO = ''; render();
    try { const r = await api('admin.inicial', {nome:fd.get('nome'), pin:fd.get('pin')}); S.token = r.token; S.user = r.usuario; BOOT.tem = true; await buscaConfig(false); USERS = await api('usuarios.publico'); S.view = 'inicio'; OCUP = false; persist(); render(); }
    catch (e) { OCUP = false; ERRO = e.cod ? e.message : 'Sem conexão.'; render(); }
  },
  async 'troca-pin'(fd) {
    OCUP = true; ERRO = ''; render();
    try { await api('pin.trocar', {atual:fd.get('atual'), novo:fd.get('novo')}); S.user.trocar = false; S.view = 'inicio'; OCUP = false; persist(); render(); toast('PIN trocado.'); }
    catch (e) { OCUP = false; ERRO = e.cod ? e.message : 'Sem conexão.'; render(); }
  },
  'novo-usuario'(fd) { salvaUsuario({nome:fd.get('nome'), pin:fd.get('pin'), papel:fd.get('admin') ? 'admin' : 'contador', trocar:!!fd.get('trocar')}); },
  'novo-pin'(fd, f) { salvaUsuario({id:f.getAttribute('data-id'), pin:fd.get('pin'), trocar:true}); },
  async ap(fd) {
    const it = ITENS[E.i], nome = String(fd.get('nome') || '').trim(), fator = parseInt(fd.get('fator'), 10), local = fd.get('onde') === 'todos' ? '' : E.loc;
    const erro = m => { $('#ap-erro').innerHTML = `<div class="falta" style="border-left-color:var(--warn)">${esc(m)}</div>`; };
    if (!nome || !(fator >= 1)) { erro('Informe o nome e quantas unidades cabem.'); return; }
    try {
      if (ONLINE) await api('apresentacao.salvar', {item:it.id, nome, fator, local});
      let k = it.e.findIndex(e => e.n.toLowerCase() === nome.toLowerCase() && (e.l || '') === local && !e.x);
      if (k < 0) { const e = {n:nome, f:fator}; if (local) e.l = local; it.e.push(e); k = it.e.length - 1; } else it.e[k].f = fator;
      if (S.cfg) { const c = S.cfg.itens.find(x => x.id === it.id); if (c) c.e = it.e.filter(e => !e.x).map(e => Object.assign({}, e)); }
      E.emb = k; persist(); fechaAp(); desenhaItem(false); toast('Apresentação salva: ' + nome + ' = ' + fator + ' un.');
    } catch (e) { erro(e.cod ? e.message : 'Sem conexão. Tente de novo.'); }
  },
};
document.addEventListener('submit', ev => { const f = ev.target.closest('form[data-f]'); if (!f) return; ev.preventDefault(); const h = forms[f.getAttribute('data-f')]; if (h && !OCUP) h(new FormData(f), f); });
window.addEventListener('online', () => { espera = 0; bombear(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { bombear(); atualizaEstado(); } });

function render() {
  const app = $('#app');
  if (BOOT.st !== 'ok') { app.innerHTML = viewCarga(); return; }
  if (!S.user) S.view = 'login';
  if ((S.view === 'mapa' || S.view === 'resumo') && !S.sess) S.view = 'inicio';
  if (S.view === 'usuarios' && !ehAdmin()) S.view = 'inicio';
  app.innerHTML = S.view === 'login' ? viewLogin() : S.view === 'trocapin' ? viewTrocaPin() : S.view === 'usuarios' ? viewUsuarios() : S.view === 'inicio' ? viewInicio() : S.view === 'resumo' ? viewResumo() : viewMapa();
  if (S.view === 'mapa' && !LISTA) ligaMapa();
  selo();
}
iniciar();
})();
